### ========== 模型 ==========
model_name_or_path: Qwen/Qwen-1.8B
trust_remote_code: true

### ========== 微调方法：QLoRA 4-bit ==========
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj,k_proj,o_proj

### ========== 量化 ==========
quantization_bit: 4
quantization_method: bnb

### ========== 数据集 ==========
dataset_dir: finetune/data
dataset: train
eval_dataset: val
template: qwen
cutoff_len: 512

### ========== 训练超参（严格控制 Epoch 防灾难性遗忘）==========
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true

### ========== 输出 ==========
output_dir: finetune/output/qwen1.8b-lora
logging_steps: 10
save_steps: 100
eval_steps: 100
save_total_limit: 2

### ========== 评估 ==========
per_device_eval_batch_size: 2
evaluation_strategy: steps